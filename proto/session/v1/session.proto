syntax = "proto3";

package session.v1;

option go_package = "github.com/Duke-ECE/protos/gen/go/session/v1;v1";

// SessionService owns durable session records and transcripts. It is the
// platform's privilege enforcement point for session data: user-scoped RPCs
// require the caller's user_id and enforce ownership; runtime-internal RPCs
// (AppendTurn, and GetTranscript for a non-owner) require a service token.
// Storage is Postgres (agent_sessions / agent_messages); the agent-runtime
// keeps live agents in memory and writes each completed turn through here.
service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc AppendTurn(AppendTurnRequest) returns (AppendTurnResponse);
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse);
  rpc SetTitle(SetTitleRequest) returns (SetTitleResponse);
}

message CreateSessionRequest {
  string user_id = 1;  // required; becomes the session owner
  string llm_model = 2;  // informational, for display in the console
  string agent_id = 3;  // optional; the agent template this session runs
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
  string user_id = 2;  // ownership enforced
}

message GetSessionResponse {
  Session session = 1;
}

message ListSessionsRequest {
  string user_id = 1;  // required; only this user's sessions are returned
  int32 limit = 2;   // 0 = server default (50); capped (200)
  int32 offset = 3;  // 0 = first page; ordered by last_active desc
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  bool has_more = 2;  // true when another page exists after this one
}

message EndSessionRequest {
  string session_id = 1;
  string user_id = 2;  // ownership enforced
}

message EndSessionResponse {}

// DeleteSession permanently removes a session and its entire transcript.
// Ownership enforced. Deleting is allowed in any status; it is irreversible.
message DeleteSessionRequest {
  string session_id = 1;
  string user_id = 2;  // ownership enforced
}

message DeleteSessionResponse {}

// AppendTurn is the runtime's write-through after a completed Chat turn.
// Trusted callers only (service token), so no ownership check against
// user_id; user_id is carried for auditing.
message AppendTurnRequest {
  string session_id = 1;
  string user_id = 2;
  repeated TurnMessage messages = 3;  // seq fields are assigned by the server
}

message AppendTurnResponse {}

// GetTranscript returns the transcript. Allowed for the session owner
// (user_id matches) or for a service-token caller (runtime hydration).
// Pagination: with limit > 0 the server returns the latest window — the up
// to `limit` messages with seq < before_seq (before_seq = 0 means "from the
// end"), in ascending seq order; has_more is true when older messages exist
// before the window. With limit = 0 the full transcript is returned
// (legacy behavior, has_more always false).
message GetTranscriptRequest {
  string session_id = 1;
  string user_id = 2;
  int32 limit = 3;      // 0 = full transcript; capped (1000)
  int32 before_seq = 4; // 0 = start from the latest messages
}

message GetTranscriptResponse {
  repeated TurnMessage messages = 1;  // ordered by seq
  bool has_more = 2;  // true when older messages exist before this window
}

// SetTitle sets the session's display title (e.g. an LLM-generated summary
// of the first turn, or a user rename). Allowed for the session owner
// (user_id matches) or a service-token caller (runtime auto-titles); setting
// a title on an ended session is allowed (titles are editable metadata, not
// transcript content).
message SetTitleRequest {
  string session_id = 1;
  string title = 2;  // empty title is rejected
  string user_id = 3;  // owner path; when empty, the service token decides
}

message SetTitleResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  string user_id = 2;
  string status = 3;  // "active" | "ended"
  string llm_model = 4;
  string created_at = 5;  // RFC 3339
  string last_active = 6;  // RFC 3339
  string ended_at = 7;  // RFC 3339, empty unless ended
  string title = 8;  // optional display title
  string agent_id = 9;  // optional; the agent template this session runs
}

message TurnMessage {
  int32 seq = 1;
  string role = 2;  // "user" | "assistant" | "tool_call" | "tool_result" |
                    // "system" (the session's persisted system prompt;
                    // re-recorded when it changes, never a chat message)
  string content_json = 3;  // role-specific payload, JSON-encoded
  string created_at = 4;  // RFC 3339
}
